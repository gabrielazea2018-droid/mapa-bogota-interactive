# =============================================================================
# deploy-map — build the Bogotá interactive map and publish it to GitHub Pages
#
# Triggers:
#   * workflow_dispatch — run it manually from the Actions tab
#   * schedule         — every Monday 06:00 UTC (01:00 America/Bogota), so the
#                        datasets are re-fetched and the map stays fresh
#   * push to main     — only when scripts/, requirements.txt or this file change
#   * pull_request     — build + validate ONLY (never deploys)
#
# NOTE on the schedule: cron uses UTC, not your local time zone.
# 06:00 UTC = 01:00 a.m. in Bogotá (America/Bogota, UTC-5).
# =============================================================================

name: deploy-map

# NOTE: GitHub only indexes workflow files that live directly in this folder on
# the default branch, and it re-indexes when this file changes. Any edit here
# (even a comment) forces a fresh registration in the Actions inventory.
on:
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * 1'          # Mondays at 06:00 UTC = 01:00 Bogotá
  push:
    branches: [main]
    paths:
      - 'scripts/**'
      - 'requirements.txt'
      - '.github/workflows/deploy.yml'
  pull_request:
    branches: [main]

# Least privilege: the workflow only reads the repo, but the deploy job needs
# permission to write the Pages artifact and to mint the OIDC token.
permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; do not cancel a deployment already in progress.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # --------------------------------------------------------------------------
  # build: fetch -> process -> build -> validate (runs for every trigger)
  # --------------------------------------------------------------------------
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      # The next three steps regenerate everything from scratch. Network access
      # is allowed here: fetch_data.py downloads the datasets declared in
      # scripts/sources.yaml.
      - name: Fetch datasets
        run: python scripts/fetch_data.py

      - name: Process data
        run: python scripts/process_data.py

      - name: Build map
        run: python scripts/build_map.py

      - name: Validate site
        run: python scripts/validate.py

      # Upload the site/ folder as the Pages artifact. Skipped on pull requests
      # so a fork/PR can never publish anything.
      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  # --------------------------------------------------------------------------
  # deploy: publish the artifact to GitHub Pages (never runs on pull_request)
  # --------------------------------------------------------------------------
  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
